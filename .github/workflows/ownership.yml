name: Ownership regressions

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Rosetta (the vendored headers/libraries target x86_64)
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: ASan/UBSan synthetic-boundary harness
        run: tests/ownership/run.sh . fixed
